<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/common :: layout(~{::content}, 'register', '案件情報登録画面')}">
<body>
<div th:fragment="content">
    <div class="mb-3">
        <a th:href="@{/projects}" class="btn btn-outline-secondary btn-sm btn-wide">← 戻る</a>
    </div>

    <form id="registerForm" th:action="@{/projects/new}" th:object="${form}" method="post"
          enctype="multipart/form-data" data-explicit-submit>
        <div class="form-card">
        <div class="form-grid">
            <div class="f-cell full">
                <label class="f-lab">件名<span class="req">*</span></label>
                <div class="f-body">
                    <input type="text" class="form-control form-control-sm" th:field="*{subject}"
                           maxlength="200">
                    <div class="text-danger small" th:if="${fieldErrors?.get('subject')}"
                         th:text="${fieldErrors.get('subject')}"></div>
                </div>
            </div>
            <div class="f-cell full">
                <label class="f-lab">ステータス<span class="req">*</span></label>
                <div class="f-body">
                    <select class="form-select form-select-sm" th:field="*{status}"
                            style="max-width: 220px;">
                        <option th:each="s : ${statusOptions}" th:value="${s.code}"
                                th:text="${s.label}">区分</option>
                    </select>
                    <div class="text-danger small" th:if="${fieldErrors?.get('status')}"
                         th:text="${fieldErrors.get('status')}"></div>
                </div>
            </div>
            <div class="f-cell">
                <label class="f-lab">取引先</label>
                <div class="f-body">
                    <input type="text" class="form-control form-control-sm" th:field="*{client}"
                           list="clientOptions" maxlength="200">
                    <datalist id="clientOptions">
                        <option th:each="o : ${clientOptions}" th:value="${o}"></option>
                    </datalist>
                    <div class="text-danger small" th:if="${fieldErrors?.get('client')}"
                         th:text="${fieldErrors.get('client')}"></div>
                </div>
            </div>
            <div class="f-cell">
                <label class="f-lab">商流</label>
                <div class="f-body">
                    <input type="text" class="form-control form-control-sm"
                           th:field="*{distribution}" maxlength="200">
                    <div class="text-danger small" th:if="${fieldErrors?.get('distribution')}"
                         th:text="${fieldErrors.get('distribution')}"></div>
                </div>
            </div>
            <div class="f-cell full">
                <label class="f-lab">案件概要</label>
                <div class="f-body">
                    <textarea class="form-control form-control-sm" rows="3" th:field="*{overview}"
                              maxlength="2000"></textarea>
                    <div class="text-danger small" th:if="${fieldErrors?.get('overview')}"
                         th:text="${fieldErrors.get('overview')}"></div>
                </div>
            </div>
            <div class="f-cell full">
                <label class="f-lab">工程</label>
                <div class="f-body">
                    <input type="text" class="form-control form-control-sm" th:field="*{process}"
                           maxlength="200">
                    <div class="text-danger small" th:if="${fieldErrors?.get('process')}"
                         th:text="${fieldErrors.get('process')}"></div>
                </div>
            </div>
            <div class="f-cell">
                <label class="f-lab">開始日</label>
                <div class="f-body">
                    <input type="date" class="form-control form-control-sm" th:field="*{startDate}"
                           min="1900-01-01" max="9999-12-31">
                    <div class="text-danger small" th:if="${fieldErrors?.get('startDate')}"
                         th:text="${fieldErrors.get('startDate')}"></div>
                </div>
            </div>
            <div class="f-cell">
                <label class="f-lab">終了日</label>
                <div class="f-body">
                    <input type="date" class="form-control form-control-sm" th:field="*{endDate}"
                           min="1900-01-01" max="9999-12-31">
                    <div class="text-danger small" th:if="${fieldErrors?.get('endDate')}"
                         th:text="${fieldErrors.get('endDate')}"></div>
                </div>
            </div>
            <div class="f-cell full">
                <label class="f-lab">スキル</label>
                <div class="f-body">
                    <input type="text" class="form-control form-control-sm" th:field="*{skill}"
                           maxlength="200">
                    <div class="text-danger small" th:if="${fieldErrors?.get('skill')}"
                         th:text="${fieldErrors.get('skill')}"></div>
                </div>
            </div>
            <div class="f-cell">
                <label class="f-lab">人数</label>
                <div class="f-body">
                    <input type="text" class="form-control form-control-sm" th:field="*{headcount}"
                           maxlength="200">
                    <div class="text-danger small" th:if="${fieldErrors?.get('headcount')}"
                         th:text="${fieldErrors.get('headcount')}"></div>
                </div>
            </div>
            <div class="f-cell">
                <label class="f-lab">残数</label>
                <div class="f-body">
                    <input type="text" class="form-control form-control-sm"
                           th:field="*{remainingCount}" maxlength="200">
                    <div class="text-danger small" th:if="${fieldErrors?.get('remainingCount')}"
                         th:text="${fieldErrors.get('remainingCount')}"></div>
                </div>
            </div>
            <div class="f-cell full">
                <label class="f-lab">BP募集</label>
                <div class="f-body">
                    <div class="d-flex flex-column gap-2">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" th:field="*{bpRequired}"
                                   id="bpRequired">
                            <label class="form-check-label" for="bpRequired">BPの募集が必要です</label>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <span class="text-nowrap small">詳細:</span>
                            <input type="text" class="form-control form-control-sm"
                                   th:field="*{bpDetail}" maxlength="200">
                        </div>
                    </div>
                    <div class="text-danger small" th:if="${fieldErrors?.get('bpDetail')}"
                         th:text="${fieldErrors.get('bpDetail')}"></div>
                </div>
            </div>
            <div class="f-cell full">
                <label class="f-lab">作業場所</label>
                <div class="f-body">
                    <input type="text" class="form-control form-control-sm" th:field="*{workplace}"
                           maxlength="200">
                    <div class="text-danger small" th:if="${fieldErrors?.get('workplace')}"
                         th:text="${fieldErrors.get('workplace')}"></div>
                </div>
            </div>
            <div class="f-cell">
                <label class="f-lab">見込単価</label>
                <div class="f-body">
                    <input type="text" class="form-control form-control-sm"
                           th:field="*{estimatedPrice}" maxlength="200">
                    <div class="text-danger small" th:if="${fieldErrors?.get('estimatedPrice')}"
                         th:text="${fieldErrors.get('estimatedPrice')}"></div>
                </div>
            </div>
            <div class="f-cell">
                <label class="f-lab">契約種別</label>
                <div class="f-body">
                    <select class="form-select form-select-sm" th:field="*{contractType}">
                        <option value=""></option>
                        <option th:each="c : ${contractTypeOptions}" th:value="${c.code}"
                                th:text="${c.label}">区分</option>
                    </select>
                </div>
            </div>
            <div class="f-cell full">
                <label class="f-lab">備考</label>
                <div class="f-body">
                    <textarea class="form-control form-control-sm" rows="3" th:field="*{note}"
                              maxlength="4000"></textarea>
                    <div class="text-danger small" th:if="${fieldErrors?.get('note')}"
                         th:text="${fieldErrors.get('note')}"></div>
                </div>
            </div>
            <div class="f-cell full">
                <label class="f-lab">添付</label>
                <div class="f-body">
                    <div class="drop-area" id="attachmentDrop">
                        <div class="drop-icon">⤓</div>
                        <div class="drop-main">クリックでファイル選択 ／ ドラッグ＆ドロップ</div>
                        <div class="drop-sub">添付できるファイルは1件のみ</div>
                    </div>
                    <input type="file" class="d-none" id="attachment" name="attachment">
                    <span class="text-danger small" id="attachmentError"
                          th:text="${fieldErrors?.get('attachment')}"></span>
                </div>
            </div>
            <div class="f-cell full">
                <label class="f-lab">メール</label>
                <div class="f-body">
                    <div class="d-flex flex-column gap-2">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="sendMail"
                                   th:field="*{sendMail}">
                            <label class="form-check-label" for="sendMail">営業情報メールを送信する</label>
                        </div>
                        <div id="mailBodyArea">
                            <textarea class="form-control form-control-sm" rows="3"
                                      th:field="*{mailBody}" maxlength="4000"></textarea>
                            <div class="text-danger small" th:if="${fieldErrors?.get('mailBody')}"
                                 th:text="${fieldErrors.get('mailBody')}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </div>

        <div class="table-toolbar center mt-3">
            <a th:href="@{/projects}" class="btn btn-outline-secondary btn-sm">← 戻る</a>
            <button type="submit" id="registerButton" class="btn btn-primary btn-sm">登録</button>
        </div>
    </form>

    <script th:src="@{/js/file-size.js}"></script>
    <script th:src="@{/js/form-guard.js}"></script>
    <script th:src="@{/js/project-register.js}"></script>
    <script th:src="@{/js/autocomplete.js}"></script>
</div>
</body>
</html>
