<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/common :: layout(~{::content}, 'user', 'ユーザマスタ管理画面')}">
<body>
<div th:fragment="content">
    <link rel="stylesheet" th:href="@{/webjars/ag-grid-community/styles/ag-grid.css}">
    <link rel="stylesheet" th:href="@{/webjars/ag-grid-community/styles/ag-theme-quartz.css}">

    <!-- CSV エラー表示（意匠は会社マスタのモックアップ master-company-csv-*.html に準拠）。
         エラー内容が1件（形式チェック違反・業務エラーなど）のときは行頭記号・区切り線なしのプレーンテキストで表示する。 -->
    <div id="errorArea" class="csv-error" role="alert" th:if="${errorMessages}"
         th:classappend="${#lists.size(errorMessages) == 1} ? 'csv-error-single'">
        <span class="err-tri" aria-hidden="true"><span class="t"></span><span class="x">!</span></span>
        <div class="body">
            <p class="title" th:if="${errorTitle}" th:text="${errorTitle}">エラータイトル</p>
            <ul>
                <li th:each="message : ${errorMessages}" th:text="${message}">エラー内容</li>
            </ul>
        </div>
    </div>

    <div class="table-toolbar end">
        <form id="csvUploadForm" th:action="@{/master/users/csv}" method="post"
              enctype="multipart/form-data" class="d-inline">
            <input type="file" id="csvFileInput" name="csvFile" accept=".csv" class="d-none">
            <button type="button" id="csvUploadButton"
                    class="btn btn-soft btn-sm btn-wide">
                ⬆ CSVアップロード
            </button>
        </form>
        <button type="button" id="csvDownloadButton" class="btn btn-primary btn-sm">
            ⬇ CSVダウンロード
        </button>
    </div>

    <div class="pager" data-pager>
        <span style="justify-self:start;">取得データ件数: <span data-data-count
                th:text="${userCount}">0</span>件</span>
        <div class="pager-nums" data-pager-nums></div>
        <div class="pager-ctl">
            <label><span>表示件数</span>
                <select data-page-size>
                    <option value="10">10件</option>
                    <option value="20">20件</option>
                    <option value="30" selected>30件</option>
                    <option value="all">全て</option>
                </select>
            </label>
            <label><span>表示ページ</span>
                <select data-page-jump></select>
            </label>
        </div>
    </div>
    <!-- 高さは固定し、行が収まらない場合はテーブル内で縦スクロールする（画面レイアウト書 4.1.4 スクロール）。 -->
    <div id="userGrid" class="ag-theme-quartz master-grid" style="height: 480px; width: 100%;"></div>
    <div class="pager" data-pager>
        <span style="justify-self:start;">取得データ件数: <span data-data-count
                th:text="${userCount}">0</span>件</span>
        <div class="pager-nums" data-pager-nums></div>
        <div class="pager-ctl">
            <label><span>表示件数</span>
                <select data-page-size>
                    <option value="10">10件</option>
                    <option value="20">20件</option>
                    <option value="30" selected>30件</option>
                    <option value="all">全て</option>
                </select>
            </label>
            <label><span>表示ページ</span>
                <select data-page-jump></select>
            </label>
        </div>
    </div>

    <div class="info-cards">
        <div class="info-card">
            <span class="icon">i</span>
            <div style="flex:1;min-width:0;">
                <div class="title">CSVアップロードの編集属性列について</div>
                <p class="body">編集属性は0~3で設定します。各設定値は以下の通りとなります。
0: 何もしない
1: ユーザの追加
2: ユーザの更新
3: ユーザの削除
またユーザの追加時、パスワードは必須項目になります。</p>
            </div>
        </div>
        <div class="info-card">
            <span class="icon">i</span>
            <div style="flex:1;min-width:0;">
                <div class="title">CSVファイルのロール列について</div>
                <p class="body">ロールは0または9で設定します。各設定値は以下の通りになります。
0: 一般ユーザ
9: システム管理者</p>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        window.USER_ROWS = /*[[${users}]]*/ [];
        /*]]>*/
    </script>
    <script th:src="@{/webjars/ag-grid-community/dist/ag-grid-community.min.js}"></script>
    <script th:src="@{/js/pager.js}"></script>
    <script th:src="@{/js/user-master.js}"></script>
</div>
</body>
</html>
