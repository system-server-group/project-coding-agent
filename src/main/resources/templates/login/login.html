<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>営業情報管理システム — ログイン</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="center-screen">
    <form id="loginForm" class="login-card" th:action="@{/login}" method="post" novalidate>
        <div class="login-body">
            <h1 class="login-title">営業情報管理システム</h1>
            <div class="accent-rule"></div>
            <p id="loginFailureMessage" class="login-alert" th:if="${param.error}">
                ユーザIDかパスワードが間違っています。
            </p>
            <div class="mb-3">
                <label for="userId" class="field-label">ユーザID</label>
                <input type="text" id="userId" name="userId" class="form-control"
                       placeholder="SM0000" maxlength="60" autocomplete="username">
                <div id="userIdError" class="text-danger small"></div>
            </div>
            <div class="mb-4">
                <label for="password" class="field-label">パスワード</label>
                <div class="input-group">
                    <input type="password" id="password" name="password" class="form-control"
                           maxlength="60" autocomplete="current-password">
                    <button type="button" id="passwordToggle" class="btn-eye"
                            aria-label="パスワードを表示"></button>
                </div>
                <div id="passwordError" class="text-danger small"></div>
            </div>
            <div class="d-flex justify-content-center">
                <button type="submit" class="btn btn-primary px-5">ログイン</button>
            </div>
        </div>
    </form>
</div>
<script th:src="@{/js/login.js}"></script>
</body>
</html>
