<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>営業情報管理システム — エラー</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet"/>
<link href="mockup.css" rel="stylesheet"/>
</head>
<body>
<div class="center-screen">
  <div style="background:#fff;border:1px solid var(--panel-border);border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.08);width:520px;max-width:100%;padding:48px 52px 40px;text-align:center;">
    <div style="font-size:13px;color:#7a8489;font-weight:500;letter-spacing:.02em;margin-bottom:28px;">営業情報管理システム</div>
    <div style="margin:0 auto 22px;height:3px;width:56px;background:var(--accent);border-radius:var(--radius);"></div>
    <h1 style="margin:0 0 10px;font-size:22px;font-weight:700;color:#1a1a1a;letter-spacing:.01em;">An error occured</h1>
    <p style="margin:0 0 36px;font-size:15px;color:#555;line-height:1.7;">エラーが発生しました。</p>
    <div style="display:flex;gap:12px;justify-content:center;">
      <button class="btn btn-keep-size" style="height:44px;padding:0 26px;border:1px solid var(--input-border);background:#fff;color:#333;letter-spacing:.06em;">RELOAD</button>
      <a class="btn btn-keep-size" href="list.html" style="height:44px;padding:0 26px;border:1px solid var(--accent);background:var(--accent);color:#fff;letter-spacing:.06em;">TOPへ</a>
    </div>
  </div>
</div>
<script src="mockup.js"></script>
</body>
</html>
