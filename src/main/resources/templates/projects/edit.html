<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/common :: layout(~{::content}, '', '案件情報更新画面')}">

<body>
  <div th:fragment="content">
    <!-- 画面レベルのエラー（排他制御失敗・案件情報未検出）を表示する。入力値チェックのエラーは各項目の直下に表示する。
         意匠はモックアップ edit-conflict.html / edit-notfound.html（.csv-error）に準拠。1件のときはプレーンテキスト表示。 -->
    <div id="errorArea" class="csv-error" role="alert" th:if="${errorTitle}"
      th:classappend="${errorMessages != null and #lists.size(errorMessages) == 1} ? 'csv-error-single'">
      <span class="err-tri" aria-hidden="true"><span class="t"></span><span class="x">!</span></span>
      <div class="body">
        <p class="title" th:text="${errorTitle}">エラータイトル</p>
        <ul>
          <li th:each="message : ${errorMessages}" th:text="${message}">エラー内容</li>
        </ul>
      </div>
    </div>

    <div th:if="${project}">
      <div class="form-top">
        <a th:href="@{/projects}" class="btn btn-soft btn-sm btn-wide">← 戻る</a>
        <div class="form-top-divider"></div>
        <!-- 編集保護トグル（モックアップ .protect-toggle 準拠）。input 自体をトラックとして描き、右に ON／OFF を表示する -->
        <label class="protect-toggle">
          <span>編集保護</span>
          <input class="toggle-input" type="checkbox" id="editProtect" checked>
          <span class="toggle-state" aria-hidden="true"></span>
        </label>
      </div>

      <form id="editForm" th:action="@{'/projects/detail/' + ${project.managementCode}}" th:object="${form}"
        method="post" enctype="multipart/form-data" data-explicit-submit>
        <input type="hidden" th:field="*{managementCode}">
        <input type="hidden" th:field="*{loadedUpdatedAt}">
        <div class="form-card">
          <div class="form-grid">
            <div class="f-cell full">
              <label class="f-lab">件名<span class="req">*</span></label>
              <div class="f-body">
                <input type="text" class="form-control form-control-sm edit-field" th:field="*{subject}"
                  maxlength="200">
                <div class="text-danger small" th:if="${fieldErrors?.get('subject')}"
                  th:text="${fieldErrors.get('subject')}"></div>
              </div>
            </div>
            <div class="f-cell full">
              <label class="f-lab">ステータス<span class="req">*</span></label>
              <div class="f-body">
                <select class="form-select form-select-sm edit-field status-select" th:field="*{status}">
                  <option th:each="s : ${statusOptions}" th:value="${s.code}" th:text="${s.label}">区分</option>
                </select>
                <div class="text-danger small" th:if="${fieldErrors?.get('status')}"
                  th:text="${fieldErrors.get('status')}"></div>
              </div>
            </div>
            <div class="f-cell">
              <label class="f-lab">取引先</label>
              <div class="f-body">
                <input type="text" class="form-control form-control-sm edit-field" th:field="*{client}"
                  list="clientOptions" maxlength="200">
                <datalist id="clientOptions">
                  <option th:each="o : ${clientOptions}" th:value="${o}"></option>
                </datalist>
                <div class="text-danger small" th:if="${fieldErrors?.get('client')}"
                  th:text="${fieldErrors.get('client')}"></div>
              </div>
            </div>
            <div class="f-cell">
              <label class="f-lab">商流</label>
              <div class="f-body">
                <input type="text" class="form-control form-control-sm edit-field" th:field="*{distribution}"
                  maxlength="200">
                <div class="text-danger small" th:if="${fieldErrors?.get('distribution')}"
                  th:text="${fieldErrors.get('distribution')}"></div>
              </div>
            </div>
            <div class="f-cell full">
              <label class="f-lab">案件概要</label>
              <div class="f-body">
                <textarea class="form-control form-control-sm edit-field" rows="4" th:field="*{overview}"
                  maxlength="2000"></textarea>
                <div class="text-danger small" th:if="${fieldErrors?.get('overview')}"
                  th:text="${fieldErrors.get('overview')}"></div>
              </div>
            </div>
            <div class="f-cell full">
              <label class="f-lab">工程</label>
              <div class="f-body">
                <input type="text" class="form-control form-control-sm edit-field" th:field="*{process}"
                  maxlength="200">
                <div class="text-danger small" th:if="${fieldErrors?.get('process')}"
                  th:text="${fieldErrors.get('process')}"></div>
              </div>
            </div>
            <div class="f-cell">
              <label class="f-lab">開始日</label>
              <div class="f-body">
                <input type="date" class="form-control form-control-sm edit-field" th:field="*{startDate}"
                  min="1900-01-01" max="9999-12-31">
                <div class="text-danger small" th:if="${fieldErrors?.get('startDate')}"
                  th:text="${fieldErrors.get('startDate')}"></div>
              </div>
            </div>
            <div class="f-cell">
              <label class="f-lab">終了日</label>
              <div class="f-body">
                <input type="date" class="form-control form-control-sm edit-field" th:field="*{endDate}"
                  min="1900-01-01" max="9999-12-31">
                <div class="text-danger small" th:if="${fieldErrors?.get('endDate')}"
                  th:text="${fieldErrors.get('endDate')}"></div>
              </div>
            </div>
            <div class="f-cell full">
              <label class="f-lab">スキル</label>
              <div class="f-body">
                <input type="text" class="form-control form-control-sm edit-field" th:field="*{skill}" maxlength="200">
                <div class="text-danger small" th:if="${fieldErrors?.get('skill')}"
                  th:text="${fieldErrors.get('skill')}"></div>
              </div>
            </div>
            <div class="f-cell">
              <label class="f-lab">人数</label>
              <div class="f-body">
                <input type="text" class="form-control form-control-sm edit-field text-end" th:field="*{headcount}"
                  maxlength="200">
                <div class="text-danger small" th:if="${fieldErrors?.get('headcount')}"
                  th:text="${fieldErrors.get('headcount')}"></div>
              </div>
            </div>
            <div class="f-cell">
              <label class="f-lab">残数</label>
              <div class="f-body">
                <input type="text" class="form-control form-control-sm edit-field text-end" th:field="*{remainingCount}"
                  maxlength="200">
                <div class="text-danger small" th:if="${fieldErrors?.get('remainingCount')}"
                  th:text="${fieldErrors.get('remainingCount')}"></div>
              </div>
            </div>
            <div class="f-cell full">
              <label class="f-lab">BP募集</label>
              <div class="f-body">
                <div class="f-stack">
                  <label class="chk">
                    <input class="edit-field" type="checkbox" th:field="*{bpRequired}" id="bpRequired">
                    <span>BPの募集が必要です</span>
                  </label>
                  <div class="d-flex align-items-center gap-2">
                    <span class="detail-label">詳細:</span>
                    <input type="text" class="form-control form-control-sm edit-field" th:field="*{bpDetail}"
                      maxlength="200">
                  </div>
                </div>
                <div class="text-danger small" th:if="${fieldErrors?.get('bpDetail')}"
                  th:text="${fieldErrors.get('bpDetail')}"></div>
              </div>
            </div>
            <div class="f-cell full">
              <label class="f-lab">作業場所</label>
              <div class="f-body">
                <input type="text" class="form-control form-control-sm edit-field" th:field="*{workplace}"
                  maxlength="200">
                <div class="text-danger small" th:if="${fieldErrors?.get('workplace')}"
                  th:text="${fieldErrors.get('workplace')}"></div>
              </div>
            </div>
            <div class="f-cell">
              <label class="f-lab">見込単価</label>
              <div class="f-body">
                <input type="text" class="form-control form-control-sm edit-field" th:field="*{estimatedPrice}"
                  maxlength="200">
                <div class="text-danger small" th:if="${fieldErrors?.get('estimatedPrice')}"
                  th:text="${fieldErrors.get('estimatedPrice')}"></div>
              </div>
            </div>
            <div class="f-cell">
              <label class="f-lab">契約種別</label>
              <div class="f-body">
                <select class="form-select form-select-sm edit-field" th:field="*{contractType}">
                  <option value=""></option>
                  <option th:each="c : ${contractTypeOptions}" th:value="${c.code}" th:text="${c.label}">区分</option>
                </select>
              </div>
            </div>
            <div class="f-cell full">
              <label class="f-lab">備考</label>
              <div class="f-body">
                <textarea class="form-control form-control-sm edit-field" rows="4" th:field="*{note}"
                  maxlength="4000"></textarea>
                <div class="text-danger small" th:if="${fieldErrors?.get('note')}" th:text="${fieldErrors.get('note')}">
                </div>
              </div>
            </div>
            <div class="f-cell full">
              <label class="f-lab">添付</label>
              <div class="f-body">
                <!-- 登録済みの添付ファイル一覧（ul#attachmentList）は添付ファイルAPI（添付一覧）から
                             取得して project-edit.js が描画する。初期表示・削除後の再取得で表示を一元化する
                             ため、ここでは描画しない（0件時は ul 自体を出さない）。行クリックで DL／削除。 -->
                <!-- 添付ファイルの追加（任意・1件）。編集保護オン時は JS で読み取り専用にする（非表示にはしない）。 -->
                <div id="attachmentPicker">
                  <div class="drop-area" id="attachmentDrop">
                    <div class="drop-icon">⤓</div>
                    <div class="drop-main">クリックでファイル選択 ／ ドラッグ＆ドロップ</div>
                    <div class="drop-sub">添付できるファイルは1件のみ</div>
                  </div>
                  <input type="file" class="d-none" id="attachment" name="attachment">
                  <span class="text-danger small" id="attachmentError"
                    th:text="${fieldErrors?.get('attachment')}"></span>
                </div>
              </div>
            </div>
            <div class="f-cell full edit-only">
              <label class="f-lab">メール</label>
              <div class="f-body">
                <div class="f-stack">
                  <label class="chk">
                    <input type="checkbox" id="sendMail" th:field="*{sendMail}">
                    <span>営業情報メールを送信する</span>
                  </label>
                  <div id="mailBodyArea">
                    <textarea class="form-control form-control-sm" rows="5" th:field="*{mailBody}"
                      maxlength="4000"></textarea>
                    <div class="text-danger small" th:if="${fieldErrors?.get('mailBody')}"
                      th:text="${fieldErrors.get('mailBody')}"></div>
                  </div>
                </div>
              </div>
            </div>
            <div class="f-cell full">
              <div style="width:100%;height:1px;background:#e2e6e8;"></div>
            </div>
            <div class="f-cell">
              <label class="f-lab">登録者</label>
              <div class="f-body">
                <div class="meta-txt" th:text="${project.createdBy}">登録者</div>
              </div>
            </div>
            <div class="f-cell">
              <label class="f-lab">更新者</label>
              <div class="f-body">
                <div class="meta-txt" th:text="${project.updatedBy}">更新者</div>
              </div>
            </div>
            <div class="f-cell">
              <label class="f-lab">登録部署</label>
              <div class="f-body">
                <div class="meta-txt" th:text="${project.createdDepartment}">登録部署</div>
              </div>
            </div>
            <div class="f-cell">
              <label class="f-lab">更新部署</label>
              <div class="f-body">
                <div class="meta-txt" th:text="${project.updatedDepartment}">更新部署</div>
              </div>
            </div>
            <div class="f-cell">
              <label class="f-lab">登録日時</label>
              <div class="f-body">
                <div class="meta-txt" th:text="${#temporals.format(project.createdAt, 'yyyy/MM/dd HH:mm:ss')}">
                  登録日時</div>
              </div>
            </div>
            <div class="f-cell">
              <label class="f-lab">更新日時</label>
              <div class="f-body">
                <div class="meta-txt" th:text="${#temporals.format(project.updatedAt, 'yyyy/MM/dd HH:mm:ss')}">
                  更新日時</div>
              </div>
            </div>
          </div>

          <!-- 下部の操作行はカード内に置き上罫線で区切る（モックアップ準拠）。E2E が参照する .table-toolbar は維持する -->
          <div class="table-toolbar center form-actions">
            <a th:href="@{/projects}" class="btn btn-soft btn-sm">← 戻る</a>
            <button type="submit" id="submitButton" class="btn btn-primary btn-sm">
              編集確定
            </button>
          </div>
        </div>
      </form>
    </div>

    <script th:src="@{/js/file-size.js}"></script>
    <script th:src="@{/js/form-guard.js}"></script>
    <script th:src="@{/js/project-edit.js}"></script>
    <script th:src="@{/js/autocomplete.js}"></script>
  </div>
</body>

</html>
