<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${errorTitle}">Error</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="center-screen">
    <div class="error-card">
        <p class="error-brand">営業情報管理システム</p>
        <h1 class="error-title" th:text="${errorTitle}">エラーが発生しました</h1>
        <p class="error-message" th:text="${errorMessage}">エラーが発生しました。</p>
        <div class="d-flex justify-content-center gap-2">
            <button type="button" class="btn btn-outline-secondary px-4"
                    onclick="location.reload()">RELOAD</button>
            <a class="btn btn-primary px-4" th:href="@{/}">TOINDEX</a>
        </div>
    </div>
</div>
</body>
</html>
