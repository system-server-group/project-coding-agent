<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(content, activeNav, screenTitle)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>営業情報管理システム</title>
    <meta name="_csrf" th:content="${_csrf != null} ? ${_csrf.token} : ''">
    <meta name="_csrf_header" th:content="${_csrf != null} ? ${_csrf.headerName} : ''">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <header class="app-header">
        <a class="app-title" th:href="@{/projects}">営業情報管理システム</a>
        <div class="app-header-spacer"></div>
        <div class="app-header-right">
            <div class="user-info">
                <span class="user-chip">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="8" r="4" fill="currentColor"/>
                        <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" fill="currentColor"/>
                    </svg>
                </span>
                <span class="user-name" th:text="${headerUserName}">ユーザ名</span>
                <span class="user-dept" th:text="'／' + ${headerDepartmentName}">／部署名</span>
            </div>
            <nav class="app-nav">
                <div class="nav-group">
                    <div class="nav-group-label">案件情報</div>
                    <div class="nav-group-btns">
                        <a class="nav-btn" th:classappend="${activeNav == 'list'} ? 'active'"
                           th:href="@{/projects}">一覧・検索</a>
                        <a class="nav-btn" th:classappend="${activeNav == 'register'} ? 'active'"
                           th:href="@{/projects/new}">新規登録</a>
                    </div>
                </div>
                <div class="nav-divider" th:if="${headerIsAdmin}"></div>
                <div class="nav-group" th:if="${headerIsAdmin}">
                    <div class="nav-group-label">マスタ管理</div>
                    <div class="nav-group-btns">
                        <a class="nav-btn" th:classappend="${activeNav == 'company'} ? 'active'"
                           th:href="@{/master/companies}">会社マスタ</a>
                        <a class="nav-btn" th:classappend="${activeNav == 'user'} ? 'active'"
                           th:href="@{/master/users}">ユーザマスタ</a>
                        <a class="nav-btn" th:classappend="${activeNav == 'department'} ? 'active'"
                           th:href="@{/master/departments}">部署マスタ</a>
                    </div>
                </div>
                <div class="nav-divider"></div>
                <div class="nav-group">
                    <div class="nav-group-label">その他</div>
                    <div class="nav-group-btns">
                        <form class="nav-logout" th:action="@{/logout}" method="post">
                            <button type="submit" class="nav-btn">ログアウト</button>
                        </form>
                    </div>
                </div>
            </nav>
        </div>
    </header>
    <div class="screen-title">
        <span th:text="${screenTitle}">画面名</span>
        <span class="id-badge" th:if="${titleBadge}" th:text="${titleBadge}">ID:0</span>
    </div>
    <main class="app-content">
        <div th:replace="${content}">メインビューポート</div>
    </main>
</div>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
